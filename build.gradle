plugins {
	// Minecraft 26.1 and newer are distributed unobfuscated, so the non-remapping
	// Loom plugin is used everywhere. The version is pinned in gradle.properties.
	id 'net.fabricmc.fabric-loom' version "${loom_version}" apply false
}

subprojects {
	version = rootProject.version

	plugins.withId('java') {
		java {
			sourceCompatibility = JavaVersion.VERSION_25
			targetCompatibility = JavaVersion.VERSION_25
			withSourcesJar()
		}

		tasks.withType(JavaCompile).configureEach {
			options.release = 25
		}

		tasks.named('jar', Jar).configure {
			from(rootProject.file('LICENSE')) {
				rename { "${it}_${project.name}" }
			}
		}

		apply plugin: 'maven-publish'

		publishing {
			publications {
				register('mavenJava', MavenPublication) {
					from components.java
					artifactId = "xibao-fly-${project.name}"
				}
			}
		}
	}
}
